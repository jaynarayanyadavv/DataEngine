[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dataengine-cleaner"
version = "0.1.0"
description = "Reviewable data cleaning for pandas DataFrames"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0,<4", "numpy>=1.23"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4"]

[tool.setuptools]
packages = ["dataengine"]
